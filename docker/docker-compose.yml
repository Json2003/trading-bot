version: "3.9"

services:
  trading-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../env/docker.env
    environment:
      - MCP_BASE_URL=${MCP_BASE_URL:-}
      - MCP_API_KEY=${MCP_API_KEY:-}
    volumes:
      - ../data:/app/data
      - ../model_store:/app/model_store
