version: "3.9"

services:
  splitstar-ops-console:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    # Use the example env file by default; you can copy it to docker.env and point to that instead
    env_file:
      - ../env/docker.env.example
    environment:
      - MCP_BASE_URL=${MCP_BASE_URL:-}
      - MCP_API_KEY=${MCP_API_KEY:-}
    volumes:
      - ../data:/app/data
      - ../model_store:/app/model_store
