[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot-pro"
version = "0.1.0"
description = "Algo trading bot with backtesting, paper & live trading"
requires-python = ">=3.10"
readme = "README.md"
authors = [{name="Json2003"}]

dependencies = [
  "pandas>=2.0,<3",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "pyyaml>=6.0,<7",
  "ccxt>=4.3,<5",
  "fastapi>=0.112,<1",
  "uvicorn>=0.30,<1",
  "requests>=2.31,<3",
  "tenacity>=8.3,<9",
  "python-dotenv>=1.0,<2",
  "typing-extensions>=4.9,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<6",
  "mypy>=1.10,<2",
  "ruff>=0.5,<1",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E","F","I","UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --maxfail=1 --disable-warnings"

[tool.setuptools.packages.find]
include = ["tradingbot_core*", "tradingbot_ibkr*"]
