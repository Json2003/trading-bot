name: Build RomanBot Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tradingbot_ibkr/**'
      - 'scripts/package_desktop.py'
      - 'tests/test_desktop_packaging.py'
      - 'requirements.txt'
      - 'requirements-packaging.txt'
      - '.github/workflows/build-windows-exe.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tradingbot_ibkr/pyinstaller_hooks/**'
      - 'tradingbot_ibkr/requirements.txt'
      - 'tradingbot_ibkr/roman_bot.py'
      - 'tradingbot_ibkr/roman_bot.spec'
      - 'tradingbot_ibkr/romanbot_installer.iss'
      - 'scripts/package_desktop.py'
      - 'tests/test_desktop_packaging.py'
      - 'requirements.txt'
      - 'requirements-packaging.txt'
      - '.github/workflows/build-windows-exe.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-packaging.txt
            tradingbot_ibkr/requirements.txt

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install Python dependencies
        run: python -m pip install -r tradingbot_ibkr/requirements.txt -r requirements-packaging.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Test desktop packaging
        run: python -m pytest -q tests/test_desktop_packaging.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Add Inno Setup to PATH
        shell: pwsh
        run: |
          $inno = 'C:\Program Files (x86)\Inno Setup 6'
          if (Test-Path $inno) { $inno | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }

      - name: Build portable app and installer
        shell: pwsh
        run: python scripts/package_desktop.py --zip --windows-installer

      - name: Verify executable, bundled template, ZIP, and installer
        shell: pwsh
        run: |
          $artifacts = @(
            'release\desktop\RomanBot\RomanBot.exe'
            'release\desktop\RomanBot\_internal\templates\index.html'
            'release\desktop\RomanBot.zip'
            'release\desktop\RomanBotInstaller.exe'
          )
          foreach ($artifact in $artifacts) {
            $file = Get-Item -LiteralPath $artifact -ErrorAction Stop
            if ($file.PSIsContainer -or $file.Length -eq 0) { throw "Invalid build output: $artifact" }
            Write-Host "$artifact ($($file.Length) bytes)"
          }

      - name: Upload portable RomanBot package
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: RomanBot-Windows-Portable
          path: release/desktop/RomanBot.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows installer
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: RomanBot-Windows-Installer
          path: release/desktop/RomanBotInstaller.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics on failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: RomanBot-Build-Diagnostics
          path: |
            build/desktop/**
            tradingbot_ibkr/build/**
          if-no-files-found: ignore
          retention-days: 14
