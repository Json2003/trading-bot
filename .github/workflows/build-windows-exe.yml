name: Build RomanBot Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tradingbot_ibkr/**'
      - 'scripts/package_desktop.py'
      - 'requirements.txt'
      - 'requirements-packaging.txt'
      - '.github/workflows/build-windows-exe.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-packaging.txt
            tradingbot_ibkr/requirements.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          if (Test-Path tradingbot_ibkr/requirements.txt) { pip install -r tradingbot_ibkr/requirements.txt }
          pip install -r requirements-packaging.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Add Inno Setup to PATH
        shell: pwsh
        run: |
          $inno = 'C:\Program Files (x86)\Inno Setup 6'
          if (Test-Path $inno) { $inno | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }

      - name: Build portable app and installer
        shell: pwsh
        run: python scripts/package_desktop.py --zip --windows-installer

      - name: Verify packaged executable
        shell: pwsh
        run: |
          $exe = 'release\desktop\RomanBot\RomanBot.exe'
          if (-not (Test-Path $exe)) { throw "Missing packaged executable: $exe" }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-ChildItem release\desktop -Recurse | Select-Object FullName,Length

      - name: Upload portable RomanBot package
        uses: actions/upload-artifact@v4
        with:
          name: RomanBot-Windows-Portable
          path: release/desktop/RomanBot.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: RomanBot-Windows-Installer
          path: |
            release/desktop/*.exe
            release/desktop/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RomanBot-Build-Diagnostics
          path: |
            build/desktop/**
            tradingbot_ibkr/build/**
          if-no-files-found: ignore
          retention-days: 14
