name: Public Flow Volatility-Pocket Research

on:
  push:
    branches:
      - research/public-flow-volatility-pocket
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run_public_flow_volatility_pocket.py"
      - "docs/public_flow_volatility_pocket_hypothesis.md"
      - ".github/workflows/public-flow-volatility-pocket.yml"
      - "requirements_research.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-flow-volatility-pocket
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out frozen evaluator
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: python -m pip install --upgrade pip -r requirements_research.txt

      - name: Run strict local-input check
        run: |
          set -euo pipefail
          mkdir -p data/inputs/public_flow artifacts/public-flow-volatility-pocket
          python scripts/run_public_flow_volatility_pocket.py             --data-dir data/observations/binance_trade_flow             --output-dir artifacts/public-flow-volatility-pocket

      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-flow-volatility-pocket-${{ github.run_id }}
          path: artifacts/public-flow-volatility-pocket
          if-no-files-found: error
          retention-days: 90
