name: Backtest Summary

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "engine/**"
      - "strategies/**"
      - "config/**"
      - "backtest*.json"
      - "report_*.json"

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Summarize backtests
        run: |
          shopt -s nullglob
          files=(backtest*.json report_*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "# Backtest Summary" > summary-latest.md
            echo "_No backtest results found yet._" >> summary-latest.md
          else
            python scripts/summarize_backtests.py | tee summary-latest.md
          fi

      - name: Commit summary to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary-latest.md || true
          git commit -m "update backtest summary" || true
          git push || true
