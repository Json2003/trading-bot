name: Backtest Summary
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "engine/**"
      - "strategies/**"
      - "config/**"
      - "backtest*.json"
      - "report_*.json"
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          python -m pip install --upgrade pip
          pip install numpy pandas
          if [ -f pyproject.toml ]; then pip install . || true; fi
      # (Optional) re-run your backtests here if desired
      - name: Generate portfolio report
        run: |
          python scripts/portfolio_report.py | tee summary-latest.md
      - uses: actions/upload-artifact@v4
        with: { name: backtest-summary, path: summary-latest.md }
      - name: Commit summary to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary-latest.md || true
          git commit -m "chore: update backtest summary" || true
          git push || true
