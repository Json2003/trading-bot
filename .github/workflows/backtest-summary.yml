        eq=res.get("equity_curve") or res.get("equity") or data.get("equity_series") or []
        if len(eq)<2:
            print(f"- {fp}: _no equity curve_\n"); continue
        rets=eq_to_rets(eq)
        total=eq[-1]/eq[0]-1
        ann=((1+(st.mean(rets) if rets else 0))**252)-1
        dd=mdd(eq)
        sh=( (st.mean(rets) if rets else 0) / (st.pstdev(rets) or 1e-12) ) if rets else 0.0
        print(f"## {fp}\nPnL: {pct(total)} | Annualized: {pct(ann)} | MaxDD: {pct(dd)} | Sharpe: {sh:.2f}\n")
    except Exception as e:
        print(f"- {fp}: _error parsing: {e}_\n")
PY
            fi
          fi

      - name: Upload summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: backtest-summary
          path: summary-latest.md

      - name: Commit summary to repo (optional)
        if: github.event_name == 'push' && endsWith(github.ref, github.event.repository.default_branch)
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary-latest.md || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update backtest summary"
          git push
