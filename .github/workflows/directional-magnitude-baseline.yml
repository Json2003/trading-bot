# Single frozen paper-only baseline; no orders or promotion.
name: Directional Magnitude Baseline

on:
  push:
    branches:
      - research/directional-magnitude-baseline
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/directional-magnitude-baseline.yml"
      - "scripts/run_directional_magnitude_baseline.py"
      - "scripts/execution_model.py"
      - "scripts/run_momentum_volatility_research.py"
      - "scripts/run_momentum_volatility_v3.py"
      - "scripts/fetch_binance_vision_klines.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: directional-magnitude-baseline
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download completed Binance Vision candles
        run: |
          set -euo pipefail
          UNTIL="$(date -u +%Y-%m)"
          python scripts/fetch_binance_vision_klines.py --symbols BTCUSDT ETHUSDT --since 2023-01 --until "$UNTIL"
      - name: Run frozen baseline
        run: |
          set -euo pipefail
          python scripts/run_directional_magnitude_baseline.py             --btc-path data/historical/binance/normalized/BTCUSDT_1h.csv             --eth-path data/historical/binance/normalized/ETHUSDT_1h.csv             --output artifacts/directional-magnitude-baseline/report.json
      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directional-magnitude-baseline-${{ github.run_number }}
          path: artifacts/directional-magnitude-baseline
          if-no-files-found: error
          retention-days: 90
