name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  fast:
    name: Fast checks (mypy + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip (fast job)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install minimal dev deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest mypy

      - name: Run mypy
        run: python -m mypy --ignore-missing-imports -p tradingbot_ibkr

      - name: Run unit tests (skip heavy/integration)
        run: pytest -q

  heavy:
    name: Heavy checks (integration with pandas/pyarrow)
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - id: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ./.wheelhouse
          key: ${{ runner.os }}-wheelhouse-${{ hashFiles('**/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-wheelhouse-

      - name: Build wheels (cached)
        if: steps.checkout.outcome == 'success'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          mkdir -p ./.wheelhouse
          if [ -f requirements-dev.txt ]; then
            pip wheel -r requirements-dev.txt -w ./.wheelhouse || true
          fi

      - name: Install deps from cached wheels (fall back to index)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements-dev.txt ]; then
            pip install --no-index --find-links ./.wheelhouse -r requirements-dev.txt || pip install -r requirements-dev.txt
          else
            # fallback minimal set for integration tests
            pip install pytest pandas pyarrow types-python-dateutil
          fi

      - name: Run integration tests (pandas/pyarrow)
        run: pytest -q

      - name: Upload test report (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: ./pytest-report