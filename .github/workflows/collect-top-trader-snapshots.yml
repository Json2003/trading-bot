# Durable rolling collection for the anonymous top-trader research source.
# This stores source observations only; it never places or enables orders.
name: Collect Top-Trader Snapshots

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: top-trader-snapshot-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      ARCHIVE_BRANCH: research/large-trader-volume-confirmation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/large-trader-volume-confirmation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collection dependencies
        run: python -m pip install --upgrade pip

      - name: Collect latest rolling top-trader history
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime, timedelta, timezone
          end = datetime.now(timezone.utc).replace(
              hour=0, minute=0, second=0, microsecond=0
          )
          print(f"COLLECT_START={(end - timedelta(days=30)):%Y-%m-%d}")
          print(f"COLLECT_END={end:%Y-%m-%d}")
          PY
          python scripts/fetch_binance_top_trader_positioning.py \
            --symbols BTCUSDT ETHUSDT \
            --since "$COLLECT_START" \
            --until "$COLLECT_END" \
            --output-dir data/historical/binance/top_trader_staging \
            --archive-dir data/historical/binance/top_trader_archive

      - name: Commit new source observations
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical/binance/top_trader_archive
          if git diff --cached --quiet; then
            echo "No new top-trader observations were collected."
            exit 0
          fi
          git commit -m "data: archive Binance top-trader snapshots"
          git push origin "${ARCHIVE_BRANCH}"
