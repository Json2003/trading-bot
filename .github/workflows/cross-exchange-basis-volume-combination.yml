# Frozen cross-exchange basis plus volume confirmation experiment; research-only.
name: Cross-Exchange Basis Volume Combination

on:
  push:
    branches:
      - research/cross-exchange-basis-volume-combination
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cross-exchange-basis-volume-combination.yml"
      - "scripts/run_cross_exchange_basis_volume_combination.py"
      - "scripts/run_cross_exchange_lead_lag.py"
      - "scripts/fetch_coinbase_exchange_candles.py"
      - "scripts/execution_model.py"
      - "scripts/run_momentum_volatility_research.py"
      - "scripts/fetch_binance_vision_klines.py"
      - "tests/test_cross_exchange_basis_volume_combination.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-exchange-basis-volume-combination
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run regression tests
        run: python -m pytest -q tests/test_cross_exchange_basis_volume_combination.py
      - name: Download completed Binance execution candles
        run: |
          set -euo pipefail
          python scripts/fetch_binance_vision_klines.py             --symbols BTCUSDT ETHUSDT             --since 2023-06             --until 2024-11
      - name: Download completed Coinbase signal candles
        run: |
          set -euo pipefail
          python scripts/fetch_coinbase_exchange_candles.py             --products BTC-USD ETH-USD             --since 2023-06-25T00:00:00Z             --until 2024-10-15T00:00:00Z
      - name: Run frozen combination candidate
        run: |
          set -euo pipefail
          python scripts/run_cross_exchange_basis_volume_combination.py             --btc-path data/historical/binance/normalized/BTCUSDT_1h.csv             --eth-path data/historical/binance/normalized/ETHUSDT_1h.csv             --coinbase-dir data/historical/coinbase/normalized             --output artifacts/cross-exchange-basis-volume-combination/report.json
      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-exchange-basis-volume-combination
          path: artifacts/cross-exchange-basis-volume-combination
          if-no-files-found: error
          retention-days: 90
