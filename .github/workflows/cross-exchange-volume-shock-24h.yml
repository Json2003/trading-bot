# Frozen 24-hour volume-shock horizon experiment; research-only.
name: Cross-Exchange Volume Shock 24h Confirmation

on:
  push:
    branches:
      - research/cross-exchange-volume-shock-24h
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cross-exchange-volume-shock-24h.yml"
      - "scripts/run_cross_exchange_volume_shock_24h.py"
      - "scripts/run_cross_exchange_volume_shock.py"
      - "scripts/run_cross_exchange_lead_lag.py"
      - "scripts/fetch_coinbase_exchange_candles.py"
      - "scripts/execution_model.py"
      - "scripts/run_momentum_volatility_research.py"
      - "scripts/fetch_binance_vision_klines.py"
      - "tests/test_cross_exchange_volume_shock_24h.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-exchange-volume-shock-24h
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run regression tests
        run: python -m pytest -q tests/test_cross_exchange_volume_shock_24h.py
      - name: Download completed Binance execution candles
        run: |
          set -euo pipefail
          python scripts/fetch_binance_vision_klines.py \
            --symbols BTCUSDT ETHUSDT \
            --since 2023-06 \
            --until 2024-11
      - name: Download completed Coinbase lead candles
        run: |
          set -euo pipefail
          python scripts/fetch_coinbase_exchange_candles.py \
            --products BTC-USD ETH-USD \
            --since 2023-06-25T00:00:00Z \
            --until 2024-10-15T00:00:00Z
      - name: Run frozen 24-hour candidate
        run: |
          set -euo pipefail
          python scripts/run_cross_exchange_volume_shock_24h.py \
            --btc-path data/historical/binance/normalized/BTCUSDT_1h.csv \
            --eth-path data/historical/binance/normalized/ETHUSDT_1h.csv \
            --coinbase-dir data/historical/coinbase/normalized \
            --output artifacts/cross-exchange-volume-shock-24h/report.json
      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-exchange-volume-shock-24h
          path: artifacts/cross-exchange-volume-shock-24h
          if-no-files-found: error
          retention-days: 90
