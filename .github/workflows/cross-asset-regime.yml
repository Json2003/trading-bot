# Frozen cross-asset boom/bust regime experiment; research-only.
name: Cross-Asset Boom Bust Regime

on:
  push:
    branches:
      - research/cross-asset-boom-bust-regime
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cross-asset-regime.yml"
      - "scripts/fetch_cross_asset_regime_data.py"
      - "scripts/run_cross_asset_regime.py"
      - "scripts/execution_model.py"
      - "tests/test_cross_asset_regime.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-asset-boom-bust-regime
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run regression tests
        run: python -m pytest -q tests/test_cross_asset_regime.py
      - name: Download completed cross-asset and execution data
        run: |
          set -euo pipefail
          python scripts/fetch_cross_asset_regime_data.py \
            --since 2021-01 \
            --until 2026-08 \
            --output-dir data/historical/cross_asset
      - name: Run frozen cross-asset regime candidate
        run: |
          set -euo pipefail
          python scripts/run_cross_asset_regime.py \
            --data-dir data/historical/cross_asset \
            --output artifacts/cross-asset-regime/report.json
      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-asset-boom-bust-regime
          path: artifacts/cross-asset-regime
          if-no-files-found: error
          retention-days: 90
