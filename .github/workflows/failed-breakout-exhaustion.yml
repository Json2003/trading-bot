name: Failed Breakout Exhaustion Reversal

on:
  push:
    branches:
      - research/failed-breakout-exhaustion
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/failed-breakout-exhaustion.yml"
      - "scripts/run_failed_breakout_exhaustion.py"
      - "scripts/fetch_binance_vision_klines.py"
      - "scripts/run_momentum_volatility_research.py"
      - "scripts/run_momentum_volatility_v3.py"
      - "scripts/execution_model.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: failed-breakout-exhaustion
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Download completed Binance Vision candles through last complete month
        run: |
          set -euo pipefail
          python scripts/fetch_binance_vision_klines.py \
            --symbols BTCUSDT ETHUSDT \
            --since 2023-01 \
            --until 2026-08
      - name: Run hypothesis unit tests
        run: python -m pytest -q tests/test_failed_breakout_exhaustion.py
      - name: Run frozen hypothesis
        run: |
          set -euo pipefail
          python scripts/run_failed_breakout_exhaustion.py \
            --btc-path data/historical/binance/normalized/BTCUSDT_1h.csv \
            --eth-path data/historical/binance/normalized/ETHUSDT_1h.csv \
            --output artifacts/failed-breakout-exhaustion/hypothesis.json
      - name: Upload hypothesis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-breakout-exhaustion-${{ github.run_number }}
          path: artifacts/failed-breakout-exhaustion
          if-no-files-found: error
          retention-days: 90
