name: High Volume Volatility Regime Reversal

on:
  push:
    branches:
      - research/volume-volatility-regime
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/volume-volatility-regime-reversal.yml"
      - "scripts/run_volume_volatility_regime_reversal.py"
      - "scripts/fetch_binance_vision_klines.py"
      - "scripts/run_momentum_volatility_research.py"
      - "scripts/run_momentum_volatility_v3.py"
      - "scripts/execution_model.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: volume-volatility-regime-reversal
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Download completed Binance Vision candles
        run: |
          set -euo pipefail
          until_month="$(date -u +%Y-%m)"
          python scripts/fetch_binance_vision_klines.py \
            --symbols BTCUSDT ETHUSDT \
            --since 2023-01 \
            --until "$until_month"

      - name: Run hypothesis unit tests
        run: python -m pytest -q tests/test_volume_volatility_regime_reversal.py

      - name: Run frozen regime hypothesis
        run: |
          set -euo pipefail
          python scripts/run_volume_volatility_regime_reversal.py \
            --btc-path data/historical/binance/normalized/BTCUSDT_1h.csv \
            --eth-path data/historical/binance/normalized/ETHUSDT_1h.csv \
            --output artifacts/volume-volatility-regime-reversal/hypothesis.json

      - name: Upload hypothesis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volume-volatility-regime-reversal-${{ github.run_number }}
          path: artifacts/volume-volatility-regime
          if-no-files-found: error
          retention-days: 90
