name: Public Trade Flow Collection

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-trade-flow-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - name: Check out observer
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install observer dependencies
        run: python -m pip install --upgrade pip -r requirements_research.txt

      - name: Collect six-hour public market-flow window
        run: |
          set -euo pipefail
          python scripts/monitor_binance_trade_flow.py \
            --symbols BTCUSDT ETHUSDT \
            --output-dir "$RUNNER_TEMP/binance_trade_flow" \
            --duration-seconds 21600 \
            --large-trade-notional 100000 \
            --reconnect-attempts 12

      - name: Upload observer data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-trade-flow-window-${{ github.run_id }}
          path: ${{ runner.temp }}/binance_trade_flow
          if-no-files-found: error
          retention-days: 90
