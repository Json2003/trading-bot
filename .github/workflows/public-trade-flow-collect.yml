name: Public Trade Flow Collection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out observer
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install observer dependencies
        run: python -m pip install -r requirements_research.txt

      - name: Collect public market-flow observations
        run: |
          python scripts/monitor_binance_trade_flow.py \
            --symbols BTCUSDT ETHUSDT \
            --output-dir "$RUNNER_TEMP/binance_trade_flow" \
            --duration-seconds 300 \
            --large-trade-notional 100000 \
            --reconnect-attempts 3

      - name: Upload observer data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-trade-flow-observations
          path: ${{ runner.temp }}/binance_trade_flow
          if-no-files-found: warn
          retention-days: 7
