name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --upgrade pip
      - run: pip install .[dev]
      - run: ruff check .
      - run: mypy .
      - run: bandit -r . -x tests || true
      - run: pip-audit || true
      - run: pytest --cov --cov-report=term-missing
      - name: FutureWarnings check (treat as errors, ignore in tests)
        run: |
          # Treat FutureWarnings as errors, but ignore any FutureWarnings originating from test_.* modules.
          # Order matters: apply 'error' first, then override with 'ignore' for test modules.
          pytest -q -W "error::FutureWarning" -W "ignore::FutureWarning:test_.*"
      - name: pip-audit requirements files
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -r requirements.txt -r tradingbot_ibkr/requirements.txt || true
