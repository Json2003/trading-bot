name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --upgrade pip
      - run: pip install .[dev]
      - run: ruff check .
      # Validate the supported rescue path; legacy research/ML integrations have optional dependencies and separate typing debt.
      - run: >-
          mypy --ignore-missing-imports --follow-imports=skip
          execution/adapters/ccxt_executor.py
          tradingbot_ibkr/operator_api.py
          tradingbot_ibkr/operator_service.py
          tradingbot_ibkr/paper_lab_automation.py
          tradingbot_ibkr/rescue_runtime.py
          tradingbot_ibkr/strategy_candidates.py
      - name: Research controller regression tests
        run: |
          python -m py_compile \
            scripts/fetch_binance_vision_klines.py \
            scripts/run_momentum_volatility_research.py \
            scripts/run_momentum_volatility_v3.py \
            scripts/run_v3_research_controller.py
          pytest -q tests/test_v3_research_controller.py
      - run: bandit -r . -x tests || true
      - run: pip-audit || true
      - run: pytest --cov --cov-report=term-missing
      - name: FutureWarnings check (treat as errors, ignore in tests)
        run: |
          # Treat FutureWarnings as errors, but ignore any FutureWarnings originating from test_.* modules.
          # Order matters: apply 'error' first, then override with 'ignore' for test modules.
          pytest -q -W "error::FutureWarning" -W "ignore::FutureWarning:test_.*" -W "ignore:.*is deprecated.*:FutureWarning"
      - name: pip-audit requirements files
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -r requirements.txt -r tradingbot_ibkr/requirements.txt || true
