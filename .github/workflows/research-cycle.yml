name: Governed Cryptocurrency Research Cycle

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: governed-research-cycle
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore historical data and checkpoint cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/historical/binance
            artifacts/research/checkpoint.json
          key: binance-history-${{ github.run_id }}
          restore-keys: |
            binance-history-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download completed history
        run: |
          set -euo pipefail
          UNTIL="$(python - <<'PY'
          from datetime import datetime, timezone
          print(datetime.now(timezone.utc).strftime("%Y-%m"))
          PY
          )"
          python scripts/fetch_binance_vision_klines.py --symbols BTCUSDT ETHUSDT --since 2023-01 --until "$UNTIL"
      - name: Build data manifest
        run: |
          python scripts/build_research_manifest.py \
            --dataset-id "binance-vision-${{ github.run_id }}" \
            --file data/historical/binance/normalized/BTCUSDT_1h.csv \
            --file data/historical/binance/normalized/ETHUSDT_1h.csv \
            --output artifacts/research/manifest.json
      - name: Run existing research controller
        run: |
          python scripts/run_v3_research_controller.py \
            --btc-path data/historical/binance/normalized/BTCUSDT_1h.csv \
            --eth-path data/historical/binance/normalized/ETHUSDT_1h.csv \
            --min-aligned-bars 26280 \
            --max-data-age-days 45 \
            --output-dir artifacts/research/controller
      - name: Canonicalize controller results
        if: ${{ always() }}
        run: |
          if test -f artifacts/research/controller/latest.json; then
            python scripts/canonicalize_v3_results.py \\
              --state artifacts/research/controller/latest.json \\
              --output artifacts/research/canonical-results.json
          fi
      - name: Save historical data and checkpoint cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/historical/binance
            artifacts/research/checkpoint.json
          key: binance-history-${{ github.run_id }}
      - name: Upload research report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: governed-research-${{ github.run_number }}
          path: artifacts/research
          if-no-files-found: error
          retention-days: 90
